[project]
name = "retro-ears"
version = "1.0.0"
description = "Search songs and playlists and download iPod-ready music."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "yt-dlp[default]>=2026.8.19",
    "ytmusicapi>=1.12",
    "mutagen>=1.48",
    "pillow>=11.0",
    "imageio-ffmpeg>=0.6",
    "deno>=2.9",
    "httpx>=0.28",
    "certifi>=2024.2.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false
